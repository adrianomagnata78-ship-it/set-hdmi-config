name: Build set-hdmi-config
  on: [workflow_dispatch]
  jobs:
    build:
      runs-on: ubuntu-latest
      timeout-minutes: 60
      steps:
        - uses: actions/checkout@v4
        - name: Install AOSP deps
          run: |
            sudo apt-get update -qq
            sudo apt-get install -qq -y openjdk-17-jdk python3 git-core gnupg flex bison \
              gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
              libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
        - name: Download AOSP (shallow)
          run: |
            mkdir aosp && cd aosp
            repo init -u https://android.googlesource.com/platform/manifest -b android-16.0.0_r1 --depth=1 -q
            repo sync -j$(nproc) -c --no-tags -q
        - name: Build
          run: |
            mkdir -p aosp/device/samsung/taro/set-hdmi-config
            cp ../set-hdmi-config.cpp ../Android.bp aosp/device/samsung/taro/set-hdmi-config/
            cd aosp
            source build/envsetup.sh
            lunch aosp_taro-userdebug
            m set-hdmi-config -j$(nproc)
        - name: Upload binary
          uses: actions/upload-artifact@v4
          with:
            name: set-hdmi-config
            path: aosp/out/target/product/taro/vendor/bin/set-hdmi-config
